<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7fafc">
  <meta name="color-scheme" content="light">
  <meta name="format-detection" content="telephone=no">
  <title>Pakost Chatting</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23419fd9'/%3E%3Cpath d='M17 43l2.8-8.3C17.4 31.9 16 28.8 16 25.5 16 18.5 23.2 13 32 13s16 5.5 16 12.5S40.8 38 32 38c-2.4 0-4.7-.4-6.8-1.1L17 43Z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">
    <!-- ============================== Вход ============================== -->
    <section class="screen login-screen" id="login-screen" aria-labelledby="login-title">
      <div class="login-bg" aria-hidden="true">
        <span class="blob blob-a"></span>
        <span class="blob blob-b"></span>
        <span class="blob blob-c"></span>
      </div>

      <div class="login-scroll">
        <div class="login-content">
          <form class="login-card" id="login-form" novalidate>
            <div class="brand">
              <div class="logo-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M12 4.2c-4.5 0-8.2 3.1-8.2 7 0 2 1.1 3.8 3 5.1l-.8 2.9 3.2-1.5c.9.2 1.8.3 2.8.3 4.5 0 8.2-3.1 8.2-7S16.5 4.2 12 4.2Z" fill="currentColor"/>
                  <path d="M8.6 11.4h.01M12 11.4h.01M15.4 11.4h.01" stroke="#3b93cc" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
              </div>
              <div class="brand-copy">
                <h1 id="login-title">Pakost Chatting</h1>
                <p>Свой мессенджер для своих</p>
              </div>
            </div>

            <div class="login-fields">
              <label class="field" for="server-input">
                <span class="field-label">Сервер</span>
                <span class="input-shell">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3.5" y="4" width="17" height="7" rx="2"/>
                    <rect x="3.5" y="13" width="17" height="7" rx="2"/>
                    <path d="M7 7.5h.01M7 16.5h.01"/>
                  </svg>
                  <input id="server-input" name="server" type="text" inputmode="url" autocomplete="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ws://192.168.1.10:8080" required>
                </span>
                <span class="field-hint">WebSocket-адрес сервера. По умолчанию — этот компьютер, порт 8080.</span>
              </label>

              <label class="field" for="name-input">
                <span class="field-label">Имя</span>
                <span class="input-shell">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="8" r="3.5"/>
                    <path d="M5.5 20c.7-3.3 3.2-5.2 6.5-5.2s5.8 1.9 6.5 5.2"/>
                  </svg>
                  <input id="name-input" name="name" type="text" autocomplete="username" autocapitalize="words" maxlength="32" placeholder="Как тебя звать?" required>
                </span>
              </label>

              <label class="field" for="password-input">
                <span class="field-label">Пароль</span>
                <span class="input-shell">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="5" y="10" width="14" height="10" rx="2.5"/>
                    <path d="M8 10V7.5a4 4 0 0 1 8 0V10"/>
                  </svg>
                  <input id="password-input" name="password" type="password" autocomplete="current-password" maxlength="64" placeholder="Минимум 4 символа" required>
                  <button class="reveal" id="password-toggle" type="button" aria-label="Показать пароль" title="Показать пароль">
                    <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12Z"/>
                      <circle cx="12" cy="12" r="2.6"/>
                    </svg>
                    <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M3 3l18 18"/>
                      <path d="M10.6 6.2A9.6 9.6 0 0 1 12 6c6 0 9.5 6 9.5 6a15 15 0 0 1-2.8 3.5M6.5 7.4A15.6 15.6 0 0 0 2.5 12s3.5 6 9.5 6a9.8 9.8 0 0 0 4.2-.9"/>
                      <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
                    </svg>
                  </button>
                </span>
              </label>

              <label class="field" for="invite-input">
                <span class="field-label">Инвайт</span>
                <span class="input-shell">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="8" cy="12" r="3.2"/>
                    <path d="M11.2 12H21M17 12v2.7M20 12v2"/>
                  </svg>
                  <input id="invite-input" name="invite" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="64" placeholder="Если сервер закрыт">
                </span>
                <span class="field-hint">Нужен только при первом входе на закрытый сервер.</span>
              </label>
            </div>

            <p class="form-error" id="login-error" role="alert" hidden></p>

            <button class="login-submit" id="login-submit" type="submit">
              <span class="spinner" id="login-spinner" aria-hidden="true" hidden></span>
              <span id="login-submit-label">Войти</span>
            </button>

            <p class="login-note">Пароль не сохраняется. Адрес, имя и инвайт остаются в этом браузере.</p>
          </form>

          <footer class="login-footer">
            <span class="login-footer-dot" aria-hidden="true"></span>
            <span>Локальный сервер · без облака и слежки</span>
          </footer>
        </div>
      </div>
    </section>

    <!-- ============================== Основной экран ============================== -->
    <section class="screen main-screen" id="main-screen" hidden>
      <!-- Список людей -->
      <div class="view list-view" id="list-view">
        <header class="topbar">
          <div class="topbar-brand">
            <div class="brand-dot" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 4.2c-4.5 0-8.2 3.1-8.2 7 0 2 1.1 3.8 3 5.1l-.8 2.9 3.2-1.5c.9.2 1.8.3 2.8.3 4.5 0 8.2-3.1 8.2-7S16.5 4.2 12 4.2Z" fill="currentColor"/>
                <path d="M8.6 11.4h.01M12 11.4h.01M15.4 11.4h.01" stroke="#3b93cc" stroke-width="2.5" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="topbar-copy">
              <h2>Pakost Chatting</h2>
              <p class="connection-line">
                <span class="conn-dot is-offline" id="connection-dot" aria-hidden="true"></span>
                <span id="connection-label">Не в сети</span>
              </p>
            </div>
          </div>
          <button class="logout-btn" id="logout-btn" type="button" title="Выйти">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/>
              <path d="M10 8l-4 4 4 4M6 12h9"/>
            </svg>
            <span>Выйти</span>
          </button>
        </header>

        <div class="search-bar">
          <label class="search" for="search-input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5"/>
              <path d="M16 16l4 4"/>
            </svg>
            <input id="search-input" type="search" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Поиск людей">
          </label>
        </div>

        <main class="people" id="people-list" aria-label="Люди на сервере"></main>

        <footer class="list-foot">
          <span class="list-foot-mark" aria-hidden="true">●</span>
          <span id="list-foot-text">Pakost Chatting</span>
        </footer>
      </div>

      <!-- Чат -->
      <div class="view chat-view" id="chat-view" hidden>
        <header class="chat-header">
          <button class="icon-btn chat-back" id="back-btn" type="button" aria-label="Вернуться к списку" title="Назад">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 5l-7 7 7 7"/>
            </svg>
          </button>
          <span class="avatar avatar-sm" id="chat-avatar" aria-hidden="true">?</span>
          <div class="chat-heading">
            <h2 id="chat-name">Чат</h2>
            <p class="chat-status-line" id="chat-status-line">
              <span class="status-dot tone-gray" id="chat-status-dot" aria-hidden="true"></span>
              <span id="chat-status">не в сети</span>
            </p>
          </div>
        </header>

        <div class="chat-body">
          <div class="offline-banner" id="offline-banner" role="status" hidden>
            <span class="offline-dot" aria-hidden="true"></span>
            <span>Нет связи. Переподключаемся…</span>
          </div>

          <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions"></div>

          <button class="jump-btn" id="jump-btn" type="button" aria-label="К последнему сообщению" title="Вниз" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </button>
        </div>

        <form class="composer" id="composer" autocomplete="off">
          <button class="composer-icon" id="sticker-btn" type="button" aria-label="Стикеры" title="Стикеры" aria-expanded="false" aria-controls="sticker-panel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5"/>
              <path d="M8.5 14.2c.9 1.4 2.1 2.1 3.5 2.1s2.6-.7 3.5-2.1"/>
              <path d="M9 9.8h.01M15 9.8h.01" stroke-width="2.4"/>
            </svg>
          </button>

          <div class="sticker-panel" id="sticker-panel" hidden>
            <div class="sticker-panel-head">Стикеры</div>
            <div class="sticker-grid" id="sticker-grid"></div>
          </div>

          <div class="composer-field">
            <textarea id="message-input" rows="1" maxlength="4096" placeholder="Сообщение" aria-label="Сообщение" enterkeyhint="send"></textarea>
          </div>

          <button class="send-btn" id="send-btn" type="submit" aria-label="Отправить" title="Отправить" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 3 10.8 13.2"/>
              <path d="M21 3l-6.4 18-3.8-7.8L3 9.4 21 3Z"/>
            </svg>
          </button>
        </form>
      </div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <noscript>
      <div class="noscript">Для работы «Pakost Chatting» нужен JavaScript.</div>
    </noscript>
  </div>

  <script src="app.js"></script>
</body>
</html>
