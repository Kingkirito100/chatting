[workspace]
resolver = "2"
members = [
    "crates/krug-core",
    "crates/krug-server",
    "crates/krug-client",
    "crates/krug-cli",
    "crates/krug-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Круг"]

[workspace.dependencies]
krug-core = { path = "crates/krug-core" }
krug-client = { path = "crates/krug-client" }
getrandom = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
opt-level = 1
